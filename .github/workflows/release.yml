name: Release

# Creates a GitHub release (and the tag) automatically whenever the add-on
# version in alloy/config.yaml changes. The release notes are taken from the
# matching section of alloy/CHANGELOG.md.

on:
  push:
    branches: [main, master]
    paths:
      - "alloy/config.yaml"
      - "alloy/CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version from config.yaml
        id: version
        run: |
          VERSION=$(grep -E '^version:' alloy/config.yaml | head -n 1 | sed -E 's/^version:[[:space:]]*"?([^"[:space:]#]+)"?.*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read the version from alloy/config.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Add-on version: $VERSION"

      - name: Skip if the release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.exists.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $1 == "##" && $2 == v { found = 1; next }
            $1 == "##" && found   { exit }
            found                 { print }
          ' alloy/CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No section '## $VERSION' with content found in alloy/CHANGELOG.md. Add it and push again."
            exit 1
          fi

          echo "----- Release notes -----"
          cat release-notes.md

      - name: Create release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"