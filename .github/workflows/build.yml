name: Build

# Builds the add-on image for every architecture listed in alloy/config.yaml
# and pushes it to GHCR as ghcr.io/<owner>/ha-addon-alloy-<arch>:<version>.
# The Supervisor pulls exactly that tag (see `image:` in config.yaml), so
# users no longer build the image on their own device.
#
# - Pull requests: build only (no push) to make sure the image still builds.
# - Push to main:  build and push, unless the tag for this version already
#                  exists. Published versions are never overwritten; bump
#                  `version` in config.yaml to ship image changes.

on:
  push:
    branches: [main]
    paths:
      - "alloy/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "alloy/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read version and image name
        id: info
        env:
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(grep -E '^version:' alloy/config.yaml | head -n 1 | sed -E 's/^version:[[:space:]]*"?([^"[:space:]#]+)"?.*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read the version from alloy/config.yaml"
            exit 1
          fi
          IMAGE="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/ha-addon-alloy-${ARCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE:$VERSION"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to push
        id: push
        env:
          IMAGE: ${{ steps.info.outputs.image }}
          VERSION: ${{ steps.info.outputs.version }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "pull_request" ] || [ "$REF" != "refs/heads/main" ]; then
            echo "Not on main, building without push."
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::warning::$IMAGE:$VERSION already exists and is not overwritten. Bump 'version' in alloy/config.yaml to publish image changes."
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (and push)
        uses: docker/build-push-action@v6
        with:
          context: alloy
          platforms: ${{ matrix.platform }}
          push: ${{ steps.push.outputs.push == 'true' }}
          tags: |
            ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
            ${{ steps.info.outputs.image }}:latest
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.info.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
