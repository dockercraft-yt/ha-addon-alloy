configuration:
  loki_host:
    name: Host Loki
    description: >-
      Adres IP lub nazwa hosta instancji Loki, bez http:// i bez portu
      (na przykład 192.0.2.10).
  loki_port:
    name: Port Loki
    description: Port instancji Loki (domyślnie 3100).
  use_https:
    name: Używaj HTTPS
    description: >-
      Łącz się z Loki przez HTTPS zamiast HTTP. Wymaga zaufanego certyfikatu
      i serwera proxy odwrotnego przed Loki.
  use_basic_auth:
    name: Używaj uwierzytelniania Basic
    description: >-
      Wysyłaj nazwę użytkownika i hasło z każdym żądaniem. Wymaga serwera proxy
      odwrotnego przed Loki, ponieważ Loki nie obsługuje uwierzytelniania Basic.
  loki_user:
    name: Nazwa użytkownika Basic
    description: Używana tylko po włączeniu uwierzytelniania Basic.
  loki_password:
    name: Hasło Basic
    description: Używane tylko po włączeniu uwierzytelniania Basic.
network:
  12345/tcp: Interfejs Alloy
