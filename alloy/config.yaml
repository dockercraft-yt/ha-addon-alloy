name: Grafana Alloy
version: "0.1.7"
slug: alloy
description: Grafana Alloy collector that ships Home Assistant, Supervisor and add-on logs to Loki
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
journald: true        # read-only access to the host journal (HA, Supervisor, add-on logs)
map:
  - addon_config:rw   # config lives in /addon_configs/<id>_alloy/
ports:
  12345/tcp: 12345
ports_description:
  12345/tcp: Alloy web UI
webui: "http://[HOST]:[PORT:12345]"
options:
  loki_port: 3100
  use_https: false
schema:
  loki_host: str
  loki_port: port
  use_https: bool
  use_basic_auth: bool?
  loki_user: str?
  loki_password: password?