name: Grafana Alloy
version: "0.2.0"
slug: alloy
description: Grafana Alloy collector that ships Home Assistant, Supervisor and app logs to Loki
url: https://grafana.com/docs/alloy/latest/
# Prebuilt image from GHCR (built by .github/workflows/build.yml).
# The Supervisor pulls <image>:<version> instead of building locally.
image: ghcr.io/dockercraft-yt/ha-addon-alloy-{arch}
arch:
  - amd64
  - aarch64
init: false
startup: services
journald: true        # read-only access to the host journal (HA, Supervisor, app logs)
map:
  - app_config:rw            # config lives in /addon_configs/<id>_alloy/
  - homeassistant_config:ro  # /homeassistant, for custom_config_path
  - share:ro                 # /share, for custom_config_path
ports:
  12345/tcp: 12345
ports_description:
  12345/tcp: Alloy web UI
webui: "http://[HOST]:[PORT:12345]"
options:
  loki_port: 3100
  use_https: false
schema:
  loki_host: str
  loki_port: port
  use_https: bool
  use_basic_auth: bool?
  loki_user: str?
  loki_password: password?
  custom_config_path: str?